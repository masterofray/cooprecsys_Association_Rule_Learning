[database]
db_path = ./data/recommender.db
backup_path = ./data/backup

[model]
min_support = 0.01
min_confidence = 0.5
min_lift = 1.0
max_itemset_length = 5

[preprocessing]
enable_null_value_handling = true
use_column_names = true
sparse_data_support = true

[performance]
enable_parallel_processing = true
num_workers = 4
batch_size = 1000
use_cython = true

[mlflow]
mlflow_uri = http://localhost:5000
enable_mlflow = true
experiment_name = fpgrowth_recommender
artifact_path = ./mlflow_artifacts

[visualization]
plots_output_dir = ./plots
plot_dpi = 100
plot_style = seaborn

[logging]
log_level = INFO
log_file = ./logs/recommender.log
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s